<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Profile')}"></head>

<body>

<div class="stardust-shell">

    <div th:replace="~{header :: header}"></div>

    <main class="page">

        <div class="breadcrumb">
            <span>FORUM / PROFILE</span>
        </div>

        <section class="blueprint-form">

            <p class="eyebrow">
                USER // PROFILE
            </p>

            <h1>Profile</h1>

            <div class="form-group">

                <label>
                    Username
                </label>

                <p th:text="${profileUser.username}">
                    username
                </p>

            </div>

            <div class="form-group">

                <label>
                    Email
                </label>

                <p th:text="${profileUser.email}">
                    email@example.com
                </p>

            </div>

        </section>

    </main>

</div>

</body>
</html>
