<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{layout :: head(${subforum.title})}"></head>

<body>

<div class="stardust-shell">

    <div th:replace="~{header :: header}"></div>

    <main class="page">

        <!-- BREADCRUMB -->
        <div class="breadcrumb">
            <span th:utext="${breadcrumb}">
                FORUM / PATH
            </span>
        </div>


        <!-- SUBFORUM HEADER -->
        <section class="section-heading">

            <div>

                <p class="eyebrow">
                    SUBFORUM
                </p>

                <div class="subforum-title-row">

                    <span class="subforum-icon"
                          th:text="${subforum.icon}">
                        🔨
                    </span>

                    <h1 th:text="${subforum.title}">
                        Subforum
                    </h1>

                </div>

                <p th:text="${subforum.description}">
                    Description
                </p>

            </div>

        </section>


        <!-- CHILD SUBFORUMS -->
        <section th:if="${!children.isEmpty()}"
                 class="blueprint-card">

            <h3>
                Subforums
            </h3>

            <div class="subforum-list">

                <a th:each="child : ${children}"
                   th:href="@{/subforum(sub=${child.id})}"
                   th:unless="${child.hidden}"
                   class="post-link">

                    <div class="subforum-title-row">

                        <span class="subforum-icon"
                              th:text="${child.icon}">
                            🔨
                        </span>

                        <span class="title"
                              th:text="${child.title}">
                            Child Forum
                        </span>

                    </div>

                    <span class="card-description"
                          th:text="${child.description}">
                        Description
                    </span>

                </a>

            </div>

        </section>


        <!-- POSTS -->
        <section>

            <div class="section-heading">

                <div>

                    <p class="eyebrow">
                        DISCUSSIONS
                    </p>

                    <h2>
                        Posts
                    </h2>

                </div>

                <a sec:authorize="isAuthenticated()"
                   th:href="@{/addpost(sub=${subforum.id})}"
                   class="blueprint-button">
                    Create Post
                </a>

            </div>


            <div class="post-list">

                <a th:each="post : ${posts}"
                   th:href="@{/viewpost(post=${post.id})}"
                   class="blueprint-card post-link">

                    <div class="post-row">

                        <div>

                            <span class="title"
                                  th:text="${post.title}">
                                Post Title
                            </span>

                        </div>

                        <div class="post-meta">

                            <span th:text="${post.timeString}">
                                time
                            </span>

                            <br/>

                            <span>
                                BY
                                <span th:text="${post.user.username}">
                                    author
                                </span>
                            </span>

                        </div>

                    </div>

                </a>

            </div>


            <div th:if="${posts.isEmpty()}"
                 class="empty-state">

                No posts yet.

            </div>

        </section>

    </main>

</div>

</body>
</html>
