<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{layout :: head(${post.title})}"></head>

<body>
    <div class="stardust-shell">
        <div th:replace="~{header :: header}"></div>

        <main class="page">
            <div class="breadcrumb">
                <span th:utext="${breadcrumb}">FORUM / PATH</span>
            </div>

            <article>
                <header class="post-header">
                    <p class="eyebrow">DISCUSSION // POST</p>
                    <h1 th:text="${post.title}">Post Title</h1>
                    <div class="post-meta">
                        POSTED BY <strong th:text="${post.user.username}">author</strong>
                        // <span th:text="${post.timeString}">time</span>
                    </div>
                </header>

                <div class="post-content" th:text="${post.content}">Content here</div>

                <div th:if="${post.mediaUrl != null && !post.mediaUrl.isBlank()}" class="embedded-media"
                    style="margin-top: 20px;">

                    <!-- YouTube -->
                    <iframe th:if="${post.mediaUrl.contains('youtube.com') || post.mediaUrl.contains('youtu.be')}"
                        th:src="${post.embedUrl}" width="560" height="315" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>

                    <!-- Direct image link -->
                    <img th:if="${post.mediaUrl.toLowerCase().endsWith('.jpg')
             || post.mediaUrl.toLowerCase().endsWith('.jpeg')
             || post.mediaUrl.toLowerCase().endsWith('.png')
             || post.mediaUrl.toLowerCase().endsWith('.gif')
             || post.mediaUrl.toLowerCase().endsWith('.webp')}" th:src="${post.mediaUrl}" alt="Embedded post media"
                        style="max-width: 100%; height: auto;" />

                    <!-- Fallback link -->
                    <a th:unless="${post.mediaUrl.contains('youtube.com')
                 || post.mediaUrl.contains('youtu.be')
                 || post.mediaUrl.toLowerCase().endsWith('.jpg')
                 || post.mediaUrl.toLowerCase().endsWith('.jpeg')
                 || post.mediaUrl.toLowerCase().endsWith('.png')
                 || post.mediaUrl.toLowerCase().endsWith('.gif')
                 || post.mediaUrl.toLowerCase().endsWith('.webp')}" th:href="${post.mediaUrl}" target="_blank"
                        rel="noopener noreferrer">
                        Open attached media
                    </a>

                </div>

                <!-- Like Feature -->
                <div sec:authorize="isAuthenticated()" style="margin-top: 20px;">
                    <form th:action="@{/action_like(post=${post.id})}" method="post">
                        <button type="submit" th:text="${hasLiked ? '👎 Unlike' : '👍 Like'}">
                            👍 Like
                        </button>
                        <span th:text="${likeCount}">0</span>
                        <span>Likes</span>
                    </form>
                </div>
            </article>
            <div sec:authorize="isAuthenticated()" class="button-row">

                <form th:action="@{/bookmark(post=${post.id})}" method="post">

                    <button type="submit" class="blueprint-button">
                        🔖 Bookmark
                    </button>

                </form>

                <form th:action="@{/bookmark/remove(post=${post.id})}" method="post">

                    <button type="submit" class="blueprint-button">
                        Remove Bookmark
                    </button>

                </form>

            </div>
            <section>
                <h2 class="comments-heading">
                    Comments (<span th:text="${#lists.size(comments)}">0</span>)
                </h2>

                <div th:each="comment : ${comments}" class="comment-block">
                    <p class="comment-content" th:text="${comment.content}">Comment content</p>
                    <small class="post-meta">
                        BY <strong th:text="${comment.user.username}">author</strong>
                        // <span th:text="${comment.timeString}">time</span>
                    </small>
                </div>

                <div th:if="${comments.isEmpty()}" class="empty-state">
                    No comments yet.
                </div>
            </section>

            <section sec:authorize="isAuthenticated()" class="blueprint-form" style="margin-top:28px;">
                <p class="eyebrow">RESPONSE</p>
                <h3>Add a Comment</h3>

                <form th:action="@{/action_comment(post=${post.id})}" method="post">
                    <div class="form-group">
                        <label for="comment-content">Comment</label>
                        <textarea id="comment-content" name="content" required
                            placeholder="Write your comment here..."></textarea>
                    </div>

                    <button type="submit">Submit Comment</button>
                </form>
            </section>

            <div sec:authorize="!isAuthenticated()" class="empty-state">
                <a th:href="@{/loginform}">Login</a> to post a comment.
            </div>
        </main>
    </div>
</body>

</html>
