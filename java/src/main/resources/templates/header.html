<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<body>

<header th:fragment="header" class="site-header">

    <div class="header-content">

        <!-- BRAND -->
        <div class="brand-block">

            <a class="brand"
               th:href="@{/}"
               th:text="${siteName}">
                DIY STARDUST
            </a>

            <p class="brand-subtitle">
                a DIY Stardust forum
            </p>

        </div>


        <!-- SEARCH -->
        <form class="header-search"
              th:action="@{/search}"
              method="get">

            <input
                type="text"
                name="q"
                placeholder="Search forums, topics, users..."
                aria-label="Search"
                required
            />

            <button type="submit">
                Search
            </button>

        </form>


        <!-- NAVIGATION -->
        <nav class="site-nav">

            <a th:href="@{/}">
                Subforum
            </a>

            <a th:href="@{/}">
                Index
            </a>

            <a sec:authorize="isAuthenticated()"
            th:href="@{/messages}">
                Messages
            </a>

            <a sec:authorize="isAuthenticated()"
            th:href="@{/bookmarks}">
                Bookmarks
            </a>

            <a sec:authorize="isAuthenticated()"
            th:href="@{/notifications}">
                Notifications
            </a>

            <a sec:authorize="isAuthenticated()"
            th:href="@{/profile}">
                Profile
            </a>

        </nav>


        <!-- USER AREA -->
        <div class="user-area"
             sec:authorize="isAuthenticated()">

            <span class="user-label"
                  th:text="${'Hello, ' + #authentication.name}">
                Hello, user
            </span>

            <form th:action="@{/action_logout}"
                  method="post">

                <button type="submit"
                        class="logout-button">
                    Logout
                </button>

            </form>

        </div>


        <!-- LOGGED OUT -->
        <div class="user-area"
             sec:authorize="!isAuthenticated()">

            <a th:href="@{/loginform}">
                Login / Register
            </a>

        </div>

    </div>

</header>

</body>
</html>
