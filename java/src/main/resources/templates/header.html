<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>
<header th:fragment="header" class="site-header">
    <div class="header-content">
        <div>
            <a class="brand" th:href="@{/}" th:text="${siteName}">STARDUST</a>
            <p class="brand-subtitle">Discussion Forum // System Online</p>
        </div>

        <nav class="site-nav">
            <a th:href="@{/}">Forum Index</a>

            <span sec:authorize="isAuthenticated()" class="user-label"
                  th:text="'USER: ' + ${currentUser}">USER: guest</span>

            <span sec:authorize="isAuthenticated()">
                <form th:action="@{/action_logout}" method="post" style="display:inline;">
                    <button type="submit">Logout</button>
                </form>
            </span>

            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/loginform}">Login / Register</a>
            </span>
        </nav>
    </div>
</header>
</body>
</html>
