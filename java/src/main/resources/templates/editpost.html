<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Edit Post')}"></head>

<body>

<div class="stardust-shell">

    <div th:replace="~{header :: header}"></div>

    <main class="page">

        <div class="breadcrumb">
            <span th:utext="${breadcrumb}">
                FORUM / PATH
            </span>
        </div>

        <section class="blueprint-form">

            <p class="eyebrow">
                DISCUSSION // EDIT POST
            </p>

            <h1>
                Edit Post
            </h1>

            <form th:action="@{/action_editpost(post=${post.id})}"
                  method="post">

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        th:value="${post.title}"
                        required>

                </div>


                <div class="form-group">

                    <label for="content">
                        Content
                    </label>

                    <textarea
                        id="content"
                        name="content"
                        required
                        th:text="${post.content}"></textarea>

                </div>


                <div th:if="${errors != null and !errors.isEmpty()}"
                     class="empty-state">

                    <ul>
                        <li th:each="error : ${errors}"
                            th:text="${error}">
                            Error
                        </li>
                    </ul>

                </div>


                <div style="margin-top: 20px;">

                    <button type="submit">
                        Save Changes
                    </button>

                    <a th:href="@{/viewpost(post=${post.id})}">
                        <button type="button">
                            Cancel
                        </button>
                    </a>

                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
