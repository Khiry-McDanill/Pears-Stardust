<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{layout :: head('Messages')}"></head>

<body>

<div class="stardust-shell">

    <div th:replace="~{header :: header}"></div>

    <main class="page messages-page">

        <div class="breadcrumb">
            <span>FORUM / MESSAGES</span>
        </div>

        <section class="messages-container">

            <!-- CONVERSATION HEADER -->
            <div class="messages-header">
                <div>
                    <p class="eyebrow">DIRECT MESSAGES</p>

                    <h1>
                        Conversation with
                        <span th:text="${otherUser.username}">
                            User
                        </span>
                    </h1>
                </div>
            </div>


            <!-- MESSAGE THREAD -->
            <div class="message-thread">

                <div th:if="${#lists.isEmpty(messages)}"
                     class="empty-state">

                    No messages yet. Start the conversation.

                </div>


                <div th:each="message : ${messages}"
                     class="message-row"
                     th:classappend="${message.sender.username == #authentication.name}
                         ? ' sent'
                         : ' received'">

                    <div class="message-bubble">

                        <div class="message-sender"
                             th:text="${message.sender.username}">
                            Username
                        </div>

                        <p class="message-content"
                           th:text="${message.content}">
                            Message content
                        </p>

                        <small class="message-time"
                               th:text="${#temporals.format(message.sentAt,
                               'MMM d, h:mm a')}">
                            Time
                        </small>

                    </div>

                </div>

            </div>


            <!-- MESSAGE COMPOSER -->
            <form class="message-compose"
                  th:action="@{/messages/{username}(username=${otherUser.username})}"
                  method="post">

                <textarea
                        name="content"
                        placeholder="Type a message..."
                        required></textarea>

                <button type="submit">
                    Send
                </button>

            </form>

        </section>

    </main>

</div>

</body>
</html>
